<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubTracker Pro | Custom Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @media print {
      .no-print { display: none !important; }
      body { background-color: white !important; color: black !important; }
      .bg-zinc-900, .bg-zinc-800 { background: white !important; color: black !important; border: 1px solid #ddd !important; }
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8 font-sans">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- الهيدر والتحكم -->
    <div class="flex flex-col sm:flex-row justify-between items-center bg-zinc-900 p-6 rounded-3xl border border-zinc-800 gap-4 shadow-xl">
      <div>
        <h1 class="text-2xl font-black text-amber-500 tracking-wide"><i class="fa-solid fa-bolt me-2"></i>SubTracker Pro</h1>
        <p id="txt-subtitle" class="text-xs text-zinc-400 mt-1">إدارة الاشتراكات والتكاليف الشهرية والسنوية</p>
      </div>
      
      <!-- الأزرار -->
      <div class="flex flex-wrap gap-2 no-print">
        <button onclick="openModal()" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-extrabold px-4 py-2.5 rounded-2xl text-xs transition shadow-lg shadow-amber-500/10">
          <i class="fa-solid fa-plus me-1"></i> <span id="btn-add-text">إضافة اشتراك / دومين</span>
        </button>
        <button onclick="toggleLanguage()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-2.5 rounded-2xl text-xs transition border border-zinc-700">
          <i class="fa-solid fa-globe me-1"></i> <span id="btn-lang-text">English</span>
        </button>
        <button onclick="exportToExcel()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-2.5 rounded-2xl text-xs transition border border-zinc-700">
          <i class="fa-solid fa-file-excel me-1"></i> <span id="btn-excel-text">تصدير Excel</span>
        </button>
        <button onclick="window.print()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-2.5 rounded-2xl text-xs transition border border-zinc-700">
          <i class="fa-solid fa-print me-1"></i> <span id="btn-print-text">طباعة</span>
        </button>
      </div>
    </div>

    <!-- كروت الإحصائيات -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-lg">
        <span id="lbl-monthly-cost" class="text-xs text-zinc-400 font-semibold uppercase">التكلفة الشهرية</span>
        <h3 id="monthlyCost" class="text-3xl font-black text-amber-500 mt-2">$0.00</h3>
      </div>
      <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-lg">
        <span id="lbl-yearly-cost" class="text-xs text-zinc-400 font-semibold uppercase">التكلفة السنوية الإجمالية</span>
        <h3 id="yearlyCost" class="text-3xl font-black text-orange-500 mt-2">$0.00</h3>
      </div>
      <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800 shadow-lg">
        <div class="flex justify-between items-center">
          <span id="lbl-yearly-income" class="text-xs text-zinc-400 font-semibold uppercase">الدخل السنوي</span>
          <button onclick="updateIncomePrompt()" class="text-xs text-amber-500 hover:underline no-print font-bold">
            <i class="fa-solid fa-pen me-1"></i><span id="btn-edit-text">تعديل</span>
          </button>
        </div>
        <h3 id="yearlyIncome" class="text-3xl font-black text-violet-400 mt-2">$0.00</h3>
      </div>
    </div>

    <!-- جدول الاشتراكات -->
    <div class="bg-zinc-900 rounded-3xl border border-zinc-800 overflow-hidden shadow-xl">
      <div class="p-5 border-b border-zinc-800">
        <h2 id="lbl-table-title" class="text-base font-bold text-zinc-200">الاشتراكات الحالية</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-right text-sm text-zinc-300" id="mainTable">
          <thead class="bg-zinc-950 text-zinc-500 uppercase text-xs font-bold">
            <tr>
              <th id="th-name" class="p-4">اسم الخدمة / الدومين</th>
              <th id="th-category" class="p-4">الفئة</th>
              <th id="th-cost" class="p-4">التكلفة</th>
              <th id="th-cycle" class="p-4">دورة الدفع</th>
              <th id="th-date" class="p-4">تاريخ التجديد</th>
              <th id="th-actions" class="p-4 text-center no-print">الإجراءات</th>
            </tr>
          </thead>
          <tbody id="subscriptionsTable" class="divide-y divide-zinc-800/60"></tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- نافذة إضافة اشتراك (Modal) -->
  <div id="subModal" class="fixed inset-0 bg-zinc-950/85 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl">
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <h3 id="modal-title" class="text-lg font-black text-amber-500">إضافة اشتراك / دومين جديد</h3>
        <button onclick="closeModal()" class="text-zinc-500 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>
      <form id="addSubForm" onsubmit="handleAddSubscription(event)" class="space-y-3">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">اسم الخدمة أو الدومين</label>
          <input type="text" id="subName" required placeholder="مثال: Google Domains / Vercel" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">الفئة</label>
          <input type="text" id="subCategory" placeholder="مثال: استضافة / سيرفر / خادم" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-zinc-400 mb-1">التكلفة ($)</label>
            <input type="number" step="0.01" min="0" id="subAmount" required placeholder="12.00" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs text-zinc-400 mb-1">دورة الدفع</label>
            <select id="subCycle" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
              <option value="monthly">شهري</option>
              <option value="yearly">سنوي</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">تاريخ التجديد</label>
          <input type="date" id="subDueDate" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-sm focus:outline-none focus:border-amber-500">
        </div>
        <div class="flex justify-end gap-2 pt-3 border-t border-zinc-800">
          <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs font-bold">إلغاء</button>
          <button type="submit" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-black rounded-xl text-xs">حفظ</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentLang = localStorage.getItem('appLang') || 'ar';
    let annualIncome = parseFloat(localStorage.getItem('annualIncome')) || 0;
    let globalSubscriptions = [];

    const i18n = {
      ar: {
        subtitle: "إدارة الاشتراكات والتكاليف الشهرية والسنوية",
        addBtn: "إضافة اشتراك / دومين",
        langBtn: "English",
        excelBtn: "تصدير Excel",
        printBtn: "طباعة التقرير",
        monthlyCost: "التكلفة الشهرية",
        yearlyCost: "التكلفة السنوية الإجمالية",
        yearlyIncome: "الدخل السنوي",
        edit: "تعديل",
        tableTitle: "الاشتراكات الحالية",
        thName: "اسم الخدمة / الدومين",
        thCategory: "الفئة",
        thCost: "التكلفة",
        thCycle: "دورة الدفع",
        thDate: "تاريخ التجديد",
        thActions: "الإجراءات",
        monthly: "شهري",
        yearly: "سنوي",
        general: "عام",
        incomePrompt: "أدخل قيمة الدخل السنوي الخاص بك ($):"
      },
      en: {
        subtitle: "Manage subscriptions, domains & costs",
        addBtn: "Add Subscription / Domain",
        langBtn: "عربي",
        excelBtn: "Export Excel",
        printBtn: "Print Report",
        monthlyCost: "Monthly Cost",
        yearlyCost: "Total Yearly Cost",
        yearlyIncome: "Annual Income",
        edit: "Edit",
        tableTitle: "Active Subscriptions",
        thName: "Service / Domain Name",
        thCategory: "Category",
        thCost: "Cost",
        thCycle: "Billing Cycle",
        thDate: "Renewal Date",
        thActions: "Actions",
        monthly: "Monthly",
        yearly: "Yearly",
        general: "General",
        incomePrompt: "Enter your annual income ($):"
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function openModal() { document.getElementById('subModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('subModal').classList.add('hidden'); }

    function applyLanguage() {
      const t = i18n[currentLang];
      document.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.getElementById('mainTable').className = currentLang === 'ar' ? "w-full text-right text-sm text-zinc-300" : "w-full text-left text-sm text-zinc-300";

      document.getElementById('txt-subtitle').innerText = t.subtitle;
      document.getElementById('btn-add-text').innerText = t.addBtn;
      document.getElementById('btn-lang-text').innerText = t.langBtn;
      document.getElementById('btn-excel-text').innerText = t.excelBtn;
      document.getElementById('btn-print-text').innerText = t.printBtn;
      document.getElementById('lbl-monthly-cost').innerText = t.monthlyCost;
      document.getElementById('lbl-yearly-cost').innerText = t.yearlyCost;
      document.getElementById('lbl-yearly-income').innerText = t.yearlyIncome;
      document.getElementById('btn-edit-text').innerText = t.edit;
      document.getElementById('lbl-table-title').innerText = t.tableTitle;
      document.getElementById('th-name').innerText = t.thName;
      document.getElementById('th-category').innerText = t.thCategory;
      document.getElementById('th-cost').innerText = t.thCost;
      document.getElementById('th-cycle').innerText = t.thCycle;
      document.getElementById('th-date').innerText = t.thDate;
      document.getElementById('th-actions').innerText = t.thActions;

      renderTableAndStats(globalSubscriptions);
    }

    function toggleLanguage() {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      localStorage.setItem('appLang', currentLang);
      applyLanguage();
    }

    async function fetchSubscriptions() {
      try {
        const res = await fetch('/api/subscriptions');
        if (!res.ok) throw new Error("Network error");
        const data = await res.json();
        globalSubscriptions = Array.isArray(data) ? data : [];
        renderTableAndStats(globalSubscriptions);
      } catch (err) {
        console.error("خطأ في جلب البيانات:", err);
      }
    }

    async function handleAddSubscription(e) {
      e.preventDefault();
      const payload = {
        name: document.getElementById('subName').value,
        category: document.getElementById('subCategory').value,
        amount: parseFloat(document.getElementById('subAmount').value) || 0,
        billing_cycle: document.getElementById('subCycle').value,
        next_due_date: document.getElementById('subDueDate').value || null
      };

      try {
        const res = await fetch('/api/subscriptions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          closeModal();
          document.getElementById('addSubForm').reset();
          fetchSubscriptions();
        }
      } catch (err) {
        console.error("خطأ في حفظ البيانات:", err);
      }
    }

    async function deleteSub(id) {
      if (!id || isNaN(id)) return;
      if (!confirm(currentLang === 'ar' ? "هل أنت تأكد من حذف هذا الاشتراك؟" : "Are you sure you want to delete this subscription?")) return;
      try {
        const res = await fetch(`/api/subscriptions/${id}`, { method: 'DELETE' });
        if (res.ok) fetchSubscriptions();
      } catch (err) {
        console.error("خطأ في الحذف:", err);
      }
    }

    function renderTableAndStats(subs) {
      const t = i18n[currentLang];
      const tbody = document.getElementById('subscriptionsTable');
      tbody.innerHTML = '';

      let monthlyTotal = 0;

      subs.forEach(sub => {
        const amount = parseFloat(sub.amount);
        const validAmount = isNaN(amount) || amount < 0 ? 0 : amount;
        const cycle = sub.billing_cycle || sub.cycle || 'monthly';
        
        if (cycle === 'monthly') {
          monthlyTotal += validAmount;
        } else if (cycle === 'yearly') {
          monthlyTotal += validAmount / 12;
        }

        const safeName = escapeHtml(sub.name);
        const safeCategory = escapeHtml(sub.category || t.general);
        const safeId = parseInt(sub.id, 10);

        tbody.innerHTML += `
          <tr class="hover:bg-zinc-800/40 transition">
            <td class="p-4 font-bold text-zinc-100">${safeName}</td>
            <td class="p-4"><span class="bg-zinc-800 text-zinc-300 px-2.5 py-1 rounded-lg text-xs font-semibold border border-zinc-700/50">${safeCategory}</span></td>
            <td class="p-4 font-extrabold text-amber-500">$${validAmount.toFixed(2)}</td>
            <td class="p-4 text-xs font-semibold">${cycle === 'monthly' ? t.monthly : t.yearly}</td>
            <td class="p-4 text-zinc-400 text-xs">${sub.next_due_date ? new Date(sub.next_due_date).toLocaleDateString(currentLang === 'ar' ? 'ar-EG' : 'en-US') : '-'}</td>
            <td class="p-4 text-center no-print">
              <button onclick="deleteSub(${safeId})" class="text-zinc-500 hover:text-rose-400 transition p-2"><i class="fa-solid fa-trash"></i></button>
            </td>
          </tr>
        `;
      });

      const yearlyTotal = monthlyTotal * 12;

      document.getElementById('monthlyCost').innerText = `$${monthlyTotal.toFixed(2)}`;
      document.getElementById('yearlyCost').innerText = `$${yearlyTotal.toFixed(2)}`;
      document.getElementById('yearlyIncome').innerText = `$${annualIncome.toFixed(2)}`;
    }

    function updateIncomePrompt() {
      const t = i18n[currentLang];
      const val = prompt(t.incomePrompt, annualIncome);
      if (val !== null) {
        const parsed = parseFloat(val);
        if (!isNaN(parsed) && parsed >= 0) {
          annualIncome = parsed;
          localStorage.setItem('annualIncome', annualIncome);
          renderTableAndStats(globalSubscriptions);
        }
      }
    }

    function exportToExcel() {
      const t = i18n[currentLang];
      let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
      csvContent += `${t.thName},${t.thCategory},${t.thCost},${t.thCycle},${t.thDate}\n`;

      globalSubscriptions.forEach(sub => {
        const cycle = (sub.billing_cycle || sub.cycle || 'monthly') === 'monthly' ? t.monthly : t.yearly;
        const date = sub.next_due_date ? new Date(sub.next_due_date).toLocaleDateString() : '-';
        let cleanName = (sub.name || '').replace(/^[=+\-@]/, '');
        let cleanCategory = (sub.category || t.general).replace(/^[=+\-@]/, '');

        csvContent += `"${cleanName}","${cleanCategory}","${sub.amount}","${cycle}","${date}"\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `SubTracker_Report_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    applyLanguage();
    fetchSubscriptions();
  </script>

</body>
</html>
