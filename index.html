<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubTracker Pro | Dynamic Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(251, 191, 36, 0.15);
        }
        .emerald-glow {
            box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.25);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 font-sans">

    <div class="max-w-5xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-amber-500/20 pb-5">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 via-teal-300 to-amber-300">
                    SubTracker Pro
                </h1>
                <p class="text-xs text-amber-200/60 mt-1">Manage all your active recurring payments effortlessly</p>
            </div>
            <button onclick="openModal()" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white px-5 py-2.5 rounded-xl font-semibold text-sm transition shadow-lg shadow-emerald-900/40 flex items-center gap-2 border border-emerald-400/30">
                <i class="fa-solid fa-plus text-amber-300"></i> Add Subscription
            </button>
        </header>

        <!-- Subscriptions Table Container -->
        <div class="glass-card rounded-2xl p-6 shadow-2xl emerald-glow overflow-hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-gem text-amber-400"></i> Active Subscriptions
                </h2>
                <span id="subCount" class="text-xs font-semibold px-3 py-1 bg-emerald-950/80 text-emerald-300 rounded-full border border-emerald-500/30">0 Subscriptions</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                            <th class="pb-3">Service Name</th>
                            <th class="pb-3">Category</th>
                            <th class="pb-3">Amount</th>
                            <th class="pb-3">Next Due Date</th>
                            <th class="pb-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="subsTableBody" class="divide-y divide-slate-800/60">
                        <tr>
                            <td colspan="5" class="text-center py-8 text-slate-500">Loading subscriptions...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Modal Form -->
    <div id="subModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50">
        <div class="glass-card w-full max-w-md p-6 rounded-2xl shadow-2xl relative space-y-5 border border-amber-500/30">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-amber-300 flex items-center gap-2">
                    <i class="fa-solid fa-folder-plus text-emerald-400"></i> Add Subscription
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-amber-300 text-lg transition"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="addSubscriptionForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Service Name</label>
                    <input type="text" id="title" placeholder="e.g. Netflix, Spotify" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Amount ($)</label>
                        <input type="number" step="0.01" id="amount" placeholder="9.99" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
                        <input type="text" id="category" placeholder="SaaS, Streaming" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Next Payment Date</label>
                    <input type="date" id="nextPaymentDate" required class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-300 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Alert Email (Optional)</label>
                    <input type="email" id="userEmail" placeholder="your@email.com" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-200 outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                </div>

                <div class="flex gap-3 pt-3 border-t border-slate-800">
                    <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-sm font-semibold transition border border-slate-700">Cancel</button>
                    <button type="submit" id="saveBtn" class="flex-1 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-amber-200 py-2.5 rounded-xl text-sm font-semibold transition shadow-lg shadow-emerald-950 border border-emerald-400/30">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function openModal() {
            document.getElementById('subModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('subModal').classList.add('hidden');
            document.getElementById('addSubscriptionForm').reset();
        }

        async function fetchSubscriptions() {
            try {
                const response = await fetch('/api/subscriptions');
                const result = await response.json();

                const tbody = document.getElementById('subsTableBody');
                const subCount = document.getElementById('subCount');

                if (!result.success || !result.data || result.data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-500">No active subscriptions found. Add your first one!</td></tr>`;
                    subCount.innerText = '0 Subscriptions';
                    return;
                }

                subCount.innerText = `${result.data.length} Subscriptions`;

                tbody.innerHTML = result.data.map(sub => `
                    <tr class="hover:bg-emerald-950/20 transition text-sm">
                        <td class="py-4 font-semibold text-slate-200">${escapeHTML(sub.title)}</td>
                        <td class="py-4"><span class="px-2.5 py-1 bg-emerald-950/60 text-emerald-300 rounded-lg text-xs font-medium border border-emerald-500/20">${escapeHTML(sub.category || 'General')}</span></td>
                        <td class="py-4 font-bold text-amber-400">$${Number(sub.amount).toFixed(2)}</td>
                        <td class="py-4 text-slate-400">${escapeHTML(sub.nextPaymentDate)}</td>
                        <td class="py-4 text-right">
                            <button onclick="deleteSubscription('${sub.id}')" class="text-slate-500 hover:text-rose-400 transition px-2 py-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

            } catch (error) {
                document.getElementById('subsTableBody').innerHTML = `<tr><td colspan="5" class="text-center py-8 text-rose-400">Failed to load data from server.</td></tr>`;
            }
        }

        document.getElementById('addSubscriptionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = 'Saving...';

            const payload = {
                title: document.getElementById('title').value,
                amount: document.getElementById('amount').value,
                category: document.getElementById('category').value,
                nextPaymentDate: document.getElementById('nextPaymentDate').value,
                userEmail: document.getElementById('userEmail').value
            };

            try {
                const res = await fetch('/api/subscriptions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Failed to save subscription');

                closeModal();
                fetchSubscriptions();

            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerText = 'Save';
            }
        });

        async function deleteSubscription(id) {
            if (!confirm('Are you sure you want to delete this subscription?')) return;

            try {
                const res = await fetch(`/api/subscriptions/${id}`, { method: 'DELETE' });
                const data = await res.json();

                if (!res.ok) throw new Error(data.error || 'Deletion failed');

                fetchSubscriptions();
            } catch (err) {
                alert(`Error: ${err.message}`);
            }
        }

        fetchSubscriptions();
    </script>
</body>
</html>
